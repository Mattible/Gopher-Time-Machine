name: Gopher Time Machine CI Build

on:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'

defaults:
  run:
    working-directory: ./

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable containerd image store (required for docker save/load in travel.py)
        run: |
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/mattible/gopher-time-machine" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:latest
      
      # ── year-one ──────────────────────────────────────────────────────────
      - name: Build year-one image (timestamp baked in)
        run: docker build --build-arg timestamp=0001-01-01T00:00:00Z -t ${{ env.IMAGE }}:year-one .

      - name: Backdate year-one OCI metadata
        run: python travel.py ${{ env.IMAGE }}:year-one ${{ env.IMAGE }}:year-one 0001-01-01T00:00:00Z

      # ── future ────────────────────────────────────────────────────────────
      - name: Build future image (timestamp baked in)
        run: docker build --build-arg timestamp=9999-12-31T23:59:59Z -t ${{ env.IMAGE }}:future .

      - name: Backdate future OCI metadata
        run: python travel.py ${{ env.IMAGE }}:future ${{ env.IMAGE }}:future 9999-12-31T23:59:59Z
